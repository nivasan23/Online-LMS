# Round-robin by default. Passive health checks: after 3 failures a server is skipped for 15s (automatic failover).
# For active health checks use HAProxy, nginx Plus, or a cloud load balancer probing GET /health.
events { worker_connections 4096; }
http {
  log_format main '$remote_addr [$time_local] "$request" $status $upstream_addr $request_time';
  access_log /var/log/nginx/access.log main;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream lms_api {
    server app1:4000 max_fails=3 fail_timeout=15s;
    server app2:4000 max_fails=3 fail_timeout=15s;
    server app3:4000 max_fails=3 fail_timeout=15s;
    keepalive 64;
  }
  server {
    listen 80;
    # Production HTTPS: listen 443 ssl http2; ssl_certificate ...; ssl_certificate_key ...; and redirect port 80 to 443.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://lms_api;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ { proxy_pass http://lms_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /health { proxy_pass http://lms_api; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  }
}
