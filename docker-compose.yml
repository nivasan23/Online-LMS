x-app: &app
  build: { context: ., dockerfile: backend/Dockerfile }
  env_file: .env
  depends_on: [postgres, redis]
services:
  nginx: { image: "nginx:1.27-alpine", ports: ["8080:80"], volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro", "./edulearn-lms.html:/usr/share/nginx/html/index.html:ro"], depends_on: [app1, app2, app3] }
  app1: { <<: *app, environment: { INSTANCE_ID: app1 } }
  app2: { <<: *app, environment: { INSTANCE_ID: app2 } }
  app3: { <<: *app, environment: { INSTANCE_ID: app3 } }
  worker: { <<: *app, command: ["node", "src/jobs/worker.js"], environment: { INSTANCE_ID: worker } }
  postgres: { image: "postgres:16-alpine", environment: { POSTGRES_USER: edu, POSTGRES_PASSWORD: edu, POSTGRES_DB: edulearn }, volumes: ["pgdata:/var/lib/postgresql/data"] }
  redis: { image: "redis:7-alpine" }
  minio: { image: minio/minio, command: server /data --console-address ":9001", environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }, ports: ["9001:9001"], volumes: ["miniodata:/data"] }
volumes: { pgdata: {}, miniodata: {} }
